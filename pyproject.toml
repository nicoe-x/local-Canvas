[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "open-comfy-studio"
version = "0.1.3"
license = {file = "LICENSE"}
readme = "README.md"
description = "Self-hosted creative canvas and workspace for ComfyUI"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "pillow>=10.4,<13", "python-multipart>=0.0.18,<1", "websockets>=15,<17"]

[project.scripts]
open-comfy-studio = "open_studio.__main__:main"

[tool.setuptools.packages.find]
include = ["open_studio*"]

[tool.setuptools.package-data]
open_studio = ["static/*", "_canvas/*.py", "_canvas/*.json", "_canvas/static/*", "_canvas/static/vendor/three/*"]
