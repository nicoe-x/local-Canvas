services:
  studio:
    build: .
    ports:
      - "127.0.0.1:8848:8848"
    volumes:
      - studio-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8848/api/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  studio-data:
